<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>13F Quarterly Intelligence</title>
<!-- Generated by src/dashboard.py — do not edit by hand.
     Data: committed CSVs under data/holdings, data/out/changes, data/ref.
     Typeface: Newsreader (SIL Open Font License), embedded as a data URI so
     the file is fully self-contained (no network requests). -->
<style>
@font-face {
  font-family: "Newsreader";
  src: url(data:font/woff2;base64,__FONT_NEWSREADER__) format("woff2");
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
}

:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --hairline: #e1e0d9;
  --baseline: #c3c2b7;
  --accent: #2a78d6;
  --track: #b7d3f6;
  --up: #006300;
  --down: #d03b3b;
  --ring: rgba(11,11,11,.10);
  --wash: rgba(11,11,11,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --accent: #3987e5;
    --track: #184f95;
    --up: #0ca30c;
    --down: #e66767;
    --ring: rgba(255,255,255,.10);
    --wash: rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --hairline: #2c2c2a;
  --baseline: #383835;
  --accent: #3987e5;
  --track: #184f95;
  --up: #0ca30c;
  --down: #e66767;
  --ring: rgba(255,255,255,.10);
  --wash: rgba(255,255,255,.05);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
body {
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

.serif { font-family: "Newsreader", Georgia, "Times New Roman", serif; }
.num { font-variant-numeric: tabular-nums; }

/* ---- chrome ---- */
header.site {
  border-bottom: 1px solid var(--hairline);
  background: var(--surface);
}
.site-inner {
  max-width: 1180px; margin: 0 auto; padding: 14px 28px;
  display: flex; align-items: baseline; gap: 14px;
}
.masthead {
  font-family: "Newsreader", Georgia, serif;
  font-weight: 650; font-size: 19px; letter-spacing: .01em;
  color: var(--ink);
}
.masthead a { color: inherit; }
.masthead a:hover { text-decoration: none; }
.site-quarter { color: var(--ink-2); font-size: 13px; }
.site-spacer { flex: 1; }
#themeBtn {
  font: inherit; font-size: 12px; color: var(--ink-2);
  background: none; border: 1px solid var(--hairline); border-radius: 4px;
  padding: 3px 10px; cursor: pointer;
}
#themeBtn:hover { background: var(--wash); }

.wrap { max-width: 1180px; margin: 0 auto; padding: 30px 28px 64px; }
.report { max-width: 980px; }

.eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}
section { margin-bottom: 40px; }

.panel {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 6px;
}

/* ---- landing hero ---- */
.lead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px; margin-bottom: 42px; }
.lead-text h1 {
  font-family: "Newsreader", Georgia, serif;
  font-size: 40px; font-weight: 550; line-height: 1.12;
  letter-spacing: -.005em; text-wrap: balance; margin: 2px 0 10px;
}
.lead-hero { margin-left: auto; text-align: right; }
.lead-hero .heroval { font-size: 52px; font-weight: 640; line-height: 1.05; letter-spacing: -.01em; }
.lead-hero .herolabel { color: var(--muted); font-size: 12px; margin-top: 4px; }

/* ---- consensus ---- */
.consensus-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .consensus-grid { grid-template-columns: 1fr; } }
.consensus-panel { padding: 18px 20px 8px; }
.consensus-panel h2 { font-size: 15px; font-weight: 640; display: flex; align-items: baseline; gap: 8px; }
.consensus-panel h2 .glyph { font-size: 13px; }
.consensus-panel h2 .defn { font-weight: 400; font-size: 12px; color: var(--muted); }
.consensus-empty { color: var(--muted); font-size: 13px; padding: 14px 0 18px; }
table.cons { width: 100%; border-collapse: collapse; margin-top: 10px; }
table.cons td { padding: 9px 8px 9px 0; border-top: 1px solid var(--hairline); vertical-align: top; }
table.cons tr:first-child td { border-top: none; }
.cons .tick { font-weight: 640; white-space: nowrap; }
.cons .issuer { color: var(--muted); font-size: 12px; }
.cons .who { color: var(--ink-2); font-size: 12px; line-height: 1.6; }
.cons .who .mgr { white-space: nowrap; }
.cons .count { text-align: right; white-space: nowrap; font-weight: 600; }
.cons .count .n { font-size: 17px; }
.cons .count .of { color: var(--muted); font-size: 11px; font-weight: 400; }
.act-up { color: var(--up); }
.act-down { color: var(--down); }

/* ---- manager cards ---- */
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 1080px) { .cards { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 820px)  { .cards { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px)  { .cards { grid-template-columns: 1fr; } }
a.card {
  display: block; padding: 16px 18px 14px; color: inherit;
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 6px;
  transition: border-color .15s, box-shadow .15s;
}
a.card:hover { text-decoration: none; border-color: var(--baseline); box-shadow: 0 1px 6px var(--ring); }
.card .cname {
  font-family: "Newsreader", Georgia, serif;
  font-size: 18px; font-weight: 600; line-height: 1.2; margin-bottom: 10px;
  text-wrap: balance;
}
.card .cval { font-size: 24px; font-weight: 640; letter-spacing: -.01em; }
.card .cdelta { font-size: 12px; margin: 1px 0 8px; }
.card .cdelta .vs { color: var(--muted); }
.card .cmeta { color: var(--muted); font-size: 12px; line-height: 1.55; }
.card .cmeta b { color: var(--ink-2); font-weight: 600; }

/* ---- manager report ---- */
.backlink { font-size: 13px; display: inline-block; margin-bottom: 18px; }
.mhead { margin-bottom: 26px; }
.mhead h1 {
  font-family: "Newsreader", Georgia, serif;
  font-size: 38px; font-weight: 560; line-height: 1.1; letter-spacing: -.005em;
  margin: 2px 0 8px; text-wrap: balance;
}
.mhead .filers { color: var(--muted); font-size: 12.5px; line-height: 1.6; }
.mhead .qtag { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.mhead .qnote { color: var(--muted); font-size: 12px; margin-top: 6px; max-width: 70ch; }

.takeaways {
  font-family: "Newsreader", Georgia, serif;
  font-size: 18.5px; line-height: 1.55; font-weight: 450;
  max-width: 66ch; color: var(--ink);
  padding: 4px 0 0;
}

/* ---- stat tiles ---- */
.tiles { display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr 1fr; gap: 12px; }
@media (max-width: 980px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { padding: 14px 16px 12px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 6px; }
.tile .tlabel { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.tile .tval { font-size: 26px; font-weight: 640; letter-spacing: -.01em; line-height: 1.1; }
.tile.hero .tval { font-size: 34px; }
.tile .tsub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
.tile .tsub a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--hairline); }
.meter { margin-top: 8px; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.meter .fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }

/* ---- bar lists ---- */
.duo { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
.listpanel { padding: 18px 20px 10px; }
.listpanel h2 { font-size: 15px; font-weight: 640; margin-bottom: 2px; }
.listpanel .hnote { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.barrow {
  display: grid; grid-template-columns: 22px minmax(120px, 200px) 1fr 84px 52px;
  gap: 10px; align-items: center; padding: 6px 0;
  border-top: 1px solid var(--hairline);
}
.barrow:first-of-type { border-top: none; }
.sector .barrow { grid-template-columns: minmax(140px, 220px) 1fr 84px 52px; }
.barrow .rank { color: var(--muted); font-size: 11px; text-align: right; }
.barrow .bname { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
.barrow .bname b { font-weight: 640; }
.barrow .bname .issuer { color: var(--muted); font-size: 11.5px; margin-left: 6px; }
.barrow .bar { height: 12px; position: relative; }
.barrow .bar .fill {
  position: absolute; inset: 1px auto 1px 0; min-width: 2px;
  background: var(--accent); border-radius: 0 3px 3px 0;
}
.barrow .bval { text-align: right; font-size: 12.5px; }
.barrow .bwt { text-align: right; font-size: 12.5px; color: var(--ink-2); }
.barrow:hover { background: var(--wash); }

/* ---- tables ---- */
.tablepanel { padding: 18px 20px 6px; overflow-x: auto; }
.tablepanel h2 { font-size: 15px; font-weight: 640; margin-bottom: 2px; }
.tablepanel .hnote { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--muted);
  padding: 6px 12px 6px 0; border-bottom: 1px solid var(--baseline);
}
table.data th.r, table.data td.r { text-align: right; padding-right: 0; padding-left: 12px; }
table.data td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--hairline); vertical-align: baseline; }
table.data tr:last-child td { border-bottom: none; }
table.data td .issuer { color: var(--muted); font-size: 11.5px; margin-left: 6px; }
.chip { font-size: 11px; font-weight: 640; letter-spacing: .05em; white-space: nowrap; }
.arrow { color: var(--muted); }

/* ---- holdings expander ---- */
details.holdings { border: 1px solid var(--hairline); border-radius: 6px; background: var(--surface); }
details.holdings summary {
  cursor: pointer; padding: 14px 20px; font-size: 14px; font-weight: 600;
  color: var(--ink-2); list-style: none; display: flex; align-items: baseline; gap: 8px;
}
details.holdings summary::-webkit-details-marker { display: none; }
details.holdings summary::before { content: "+"; color: var(--muted); font-weight: 400; width: 12px; }
details[open].holdings summary::before { content: "\2212"; }
details.holdings summary:hover { background: var(--wash); border-radius: 6px; }
details.holdings .inner { padding: 0 20px 14px; overflow-x: auto; }

/* ---- sources / footer ---- */
.sources { font-size: 12px; color: var(--muted); line-height: 1.7; }
.sources a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--hairline); }
footer.site {
  border-top: 1px solid var(--hairline); margin-top: 30px;
  background: var(--surface);
}
.foot-inner { max-width: 1180px; margin: 0 auto; padding: 26px 28px 34px; }
.foot-inner h2 { font-size: 13px; font-weight: 640; margin-bottom: 8px; }
.foot-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 820px) { .foot-cols { grid-template-columns: 1fr; } }
.foot-inner p, .foot-inner li { font-size: 12px; color: var(--ink-2); line-height: 1.65; margin-bottom: 7px; }
.foot-inner ul { padding-left: 16px; }
.foot-inner .gen { margin-top: 16px; color: var(--muted); font-size: 11.5px; }
.foot-inner a { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--hairline); }

/* ---- tooltip ---- */
#tip {
  position: fixed; z-index: 10; pointer-events: none; display: none;
  background: var(--surface); border: 1px solid var(--baseline); border-radius: 5px;
  box-shadow: 0 2px 10px var(--ring);
  padding: 8px 11px; font-size: 12px; max-width: 300px;
}
#tip .tt-title { font-weight: 640; margin-bottom: 3px; }
#tip .tt-row { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2); }
#tip .tt-row b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<header class="site">
  <div class="site-inner">
    <span class="masthead"><a href="#/">13F Quarterly Intelligence</a></span>
    <span class="site-quarter" id="siteQuarter"></span>
    <span class="site-spacer"></span>
    <button id="themeBtn" type="button" aria-label="cycle color theme">Theme: Auto</button>
  </div>
</header>
<main id="app" class="wrap"></main>
<footer class="site"><div class="foot-inner" id="foot"></div></footer>
<div id="tip" role="presentation"></div>

<script>
"use strict";
const DATA = /*__DATA__*/null;

/* ---------- helpers ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function frag(...kids) { const f = document.createDocumentFragment(); kids.forEach(k => k && f.append(k)); return f; }
function fmtUSD(n) {
  const sign = n < 0 ? "-" : ""; n = Math.abs(n);
  if (n >= 1e9) {
    const v = n / 1e9;
    if (v >= 100) return sign + "$" + v.toLocaleString("en-US", {minimumFractionDigits: 1, maximumFractionDigits: 1}) + "bn";
    return sign + "$" + v.toFixed(2).replace(/0+$/, "").replace(/\.$/, "") + "bn";
  }
  if (n >= 1e6) return sign + "$" + (n / 1e6).toLocaleString("en-US", {minimumFractionDigits: 1, maximumFractionDigits: 1}) + "m";
  return sign + "$" + Math.round(n).toLocaleString("en-US");
}
function fmtFullUSD(n) { return "$" + Math.round(n).toLocaleString("en-US"); }
function fmtInt(n) { return Math.round(n).toLocaleString("en-US"); }
function fmtPct(x) { return x.toFixed(1) + "%"; }
function signedPct(x) { return (x >= 0 ? "+" : "") + x.toFixed(1) + "%"; }
function qlabel(q) { return q ? "Q" + q[5] + " " + q.slice(0, 4) : ""; }
const ACT = {
  new:  {glyph: "▲", label: "New",  cls: "act-up"},
  add:  {glyph: "▲", label: "Add",  cls: "act-up"},
  trim: {glyph: "▼", label: "Trim", cls: "act-down"},
  exit: {glyph: "▼", label: "Exit", cls: "act-down"},
};
function chip(action) {
  const a = ACT[action] || {glyph: "", label: action, cls: ""};
  const s = el("span", "chip " + a.cls, a.glyph + " " + a.label.toUpperCase());
  return s;
}
function clsLabel(cls) { return (cls || "").replace(/^COM(?=\s|$)\s*/, "").trim(); }
function dupNames(rows) {
  const counts = new Map();
  rows.forEach(r => { const k = r.ticker || r.issuer; counts.set(k, (counts.get(k) || 0) + 1); });
  return new Set([...counts].filter(([, n]) => n > 1).map(([k]) => k));
}
function deltaSpan(x, suffix) {
  const s = el("span", x >= 0 ? "act-up" : "act-down",
               (x >= 0 ? "▲ " : "▼ ") + signedPct(x) + (suffix || ""));
  return s;
}

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
function bindTip(node, buildRows) {
  function show(ev) {
    tip.replaceChildren(...buildRows());
    tip.style.display = "block";
    move(ev);
  }
  function move(ev) {
    const x = Math.min((ev.clientX || 0) + 14, window.innerWidth - tip.offsetWidth - 10);
    const y = Math.min((ev.clientY || 0) + 14, window.innerHeight - tip.offsetHeight - 10);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  node.addEventListener("pointerenter", show);
  node.addEventListener("pointermove", move);
  node.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  node.addEventListener("focus", ev => {
    const r = node.getBoundingClientRect();
    show({clientX: r.left + 40, clientY: r.bottom});
  });
  node.addEventListener("blur", () => { tip.style.display = "none"; });
}
function ttRow(label, value) {
  const r = el("div", "tt-row"); r.append(el("span", null, label));
  const b = el("b", null, value); r.append(b); return r;
}

/* ---------- theme ---------- */
const themeBtn = document.getElementById("themeBtn");
const THEMES = ["auto", "light", "dark"];
function applyTheme(t) {
  if (t === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  themeBtn.textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
}
let theme = "auto";
try { theme = localStorage.getItem("13f-theme") || "auto"; } catch (e) {}
applyTheme(theme);
themeBtn.addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem("13f-theme", theme); } catch (e) {}
  applyTheme(theme);
});

/* ---------- landing ---------- */
function renderLanding() {
  const app = document.getElementById("app");
  app.className = "wrap";
  const lead = el("div", "lead");
  const lt = el("div", "lead-text");
  lt.append(el("div", "eyebrow", "GEMS Investment Research"));
  lt.append(el("h1", "serif", "Twenty managers, quarter by quarter"));
  const hero = el("div", "lead-hero");
  hero.append(el("div", "heroval num", fmtUSD(DATA.combined_value)));
  hero.append(el("div", "herolabel",
    "combined main-book value · " + DATA.managers.length + " managers · " + DATA.as_of_label));
  lead.append(lt, hero);
  const consensus = renderConsensus();
  const cardsSec = el("section");
  cardsSec.append(el("div", "eyebrow", "Managers — by main-book value"));
  const grid = el("div", "cards");
  DATA.managers.forEach(m => grid.append(managerCard(m)));
  cardsSec.append(grid);
  app.replaceChildren(lead, consensus, cardsSec);
}

function renderConsensus() {
  const sec = el("section");
  sec.append(el("div", "eyebrow", "Consensus moves — " + DATA.as_of_label));
  const grid = el("div", "consensus-grid");
  grid.append(consensusPanel("buys", "Bought by several managers",
    "new positions or significant adds"));
  grid.append(consensusPanel("sells", "Sold by several managers",
    "exits or significant trims"));
  sec.append(grid);
  return sec;
}

function consensusPanel(side, title, defn) {
  const p = el("div", "panel consensus-panel");
  const h = el("h2");
  h.append(el("span", "glyph " + (side === "buys" ? "act-up" : "act-down"),
              side === "buys" ? "▲" : "▼"));
  h.append(el("span", null, title));
  h.append(el("span", "defn", defn));
  p.append(h);
  const rows = DATA.consensus[side];
  if (!rows.length) {
    p.append(el("div", "consensus-empty",
      "No ticker was " + (side === "buys" ? "bought" : "sold") +
      " by three or more managers this quarter."));
    return p;
  }
  const t = el("table", "cons");
  rows.forEach(r => {
    const tr = el("tr");
    const td1 = el("td");
    td1.append(el("div", "tick", r.ticker || "(no ticker)"));
    td1.append(el("div", "issuer", r.issuer));
    const td2 = el("td", "who");
    r.managers.forEach((m, i) => {
      const a = ACT[m.action];
      const s = el("span", "mgr");
      s.append(el("span", a.cls, a.glyph + " "));
      s.append(document.createTextNode(m.manager));
      td2.append(s);
      if (i < r.managers.length - 1) td2.append(document.createTextNode(" "));
    });
    const td3 = el("td", "count num");
    td3.append(el("span", "n", String(r.n_managers)));
    td3.append(el("span", "of", " of " + DATA.managers.length));
    tr.append(td1, td2, td3);
    t.append(tr);
  });
  p.append(t);
  return p;
}

function managerCard(m) {
  const a = el("a", "card");
  a.href = "#/m/" + m.slug;
  a.append(el("div", "cname", m.manager));
  a.append(el("div", "cval num", fmtUSD(m.stats.value)));
  const d = el("div", "cdelta num");
  d.title = "Change in reported 13F value — not performance or net flows";
  if (m.stats.qoq_pct !== null) {
    d.append(deltaSpan(m.stats.qoq_pct));
    d.append(el("span", "vs", " vs " + qlabel(m.prev_quarter)));
  } else {
    d.append(el("span", "vs", "first tracked quarter"));
  }
  a.append(d);
  const meta = el("div", "cmeta");
  const top = m.top_positions[0];
  const line1 = el("div");
  line1.append(document.createTextNode(m.stats.n_positions + " positions · "));
  const b = el("b", "num", top ? (top.ticker || top.issuer) + " " + fmtPct(top.weight_pct) : "—");
  line1.append(b);
  const line2 = el("div", null, m.changes.length + " significant change" +
    (m.changes.length === 1 ? "" : "s") +
    (m.quarter !== DATA.as_of ? " · as of " + m.quarter_label : ""));
  meta.append(line1, line2);
  a.append(meta);
  return a;
}

/* ---------- manager report ---------- */
function renderManager(slug) {
  const m = DATA.managers.find(x => x.slug === slug);
  if (!m) { location.hash = "#/"; return; }
  const app = document.getElementById("app");
  app.className = "wrap report";

  const back = el("a", "backlink", "← All managers");
  back.href = "#/";

  const head = el("div", "mhead");
  head.append(el("div", "eyebrow", "Manager report · " + m.quarter_label));
  head.append(el("h1", "serif", m.manager));
  const filers = el("div", "filers");
  filers.append(document.createTextNode(
    m.filers.map(f => f.name + " (CIK " + f.cik + ")" +
      (f.note ? " — " + f.note : "")).join(" · ")));
  head.append(filers);
  if (m.later_filing) {
    head.append(el("div", "qnote",
      "A " + qlabel(m.later_filing) + " filing is already on record for this manager; " +
      "the dashboard is pinned to " + DATA.as_of_label + " for cross-manager comparability."));
  }

  const take = el("section");
  take.append(el("div", "eyebrow", "Takeaways"));
  take.append(el("p", "takeaways", m.takeaways.join(" ")));

  const tiles = el("section");
  tiles.append(el("div", "eyebrow", "The quarter in numbers"));
  tiles.append(renderTiles(m));

  const duo = el("section");
  const duoGrid = el("div", "duo");
  duoGrid.append(renderTopPositions(m), renderSectorMix(m));
  duo.append(duoGrid);

  const chg = el("section");
  chg.append(renderChanges(m));

  const hold = el("section");
  hold.append(renderHoldings(m));

  const src = el("section");
  src.append(el("div", "eyebrow", "Sources for this page"));
  src.append(renderSources(m));

  app.replaceChildren(back, head, take, tiles, duo, chg, hold, src);
  window.scrollTo(0, 0);
}

function tile(label, value, subNodes, cls) {
  const t = el("div", "tile" + (cls ? " " + cls : ""));
  t.append(el("div", "tlabel", label));
  const v = el("div", "tval num");
  if (value instanceof Node) v.append(value); else v.textContent = value;
  t.append(v);
  if (subNodes) { const s = el("div", "tsub"); s.append(...subNodes); t.append(s); }
  return t;
}

function renderTiles(m) {
  const row = el("div", "tiles");
  const s = m.stats;

  const heroSub = [];
  if (s.qoq_pct !== null) {
    heroSub.push(deltaSpan(s.qoq_pct));
    heroSub.push(document.createTextNode(
      " vs " + qlabel(m.prev_quarter) + " (" + fmtUSD(s.value_prev) + ")" +
      " · reported value change, not performance"));
  } else {
    heroSub.push(document.createTextNode("first tracked quarter"));
  }
  row.append(tile("Main book · " + m.quarter_label, fmtUSD(s.value), heroSub, "hero"));

  row.append(renderAumTile(m));
  row.append(tile("Positions", String(s.n_positions),
    [document.createTextNode("shares-only main book")]));
  row.append(tile("Top-10 weight", fmtPct(s.top10_pct),
    [document.createTextNode("share of main-book value")]));
  const nc = m.changes.length;
  row.append(tile("Significant changes", String(nc),
    [document.createTextNode(m.prev_quarter ? "vs " + qlabel(m.prev_quarter) : "—")]));
  return row;
}

function renderAumTile(m) {
  const a = m.aum;
  if (!a.usd) {
    return tile("vs external AUM", "—",
      [document.createTextNode(a.note || "no public figure")]);
  }
  const ratio = m.stats.value / a.usd * 100;
  const t = tile("13F vs " + (a.basis.indexOf("RAUM") >= 0 ? "regulatory AUM (gross)" : a.basis),
    ratio > 200 ? (ratio / 100).toFixed(1) + "×" : fmtPct(ratio), null);
  const meter = el("div", "meter");
  const fill = el("div", "fill");
  fill.style.width = Math.min(ratio, 100) + "%";
  meter.append(fill);
  t.append(meter);
  const sub = el("div", "tsub");
  const link = el("a", null, fmtUSD(a.usd));
  link.href = a.source_url; link.target = "_blank"; link.rel = "noopener";
  sub.append(document.createTextNode("of "), link,
    document.createTextNode(" · " + a.basis + ", " + a.as_of));
  t.append(sub);
  return t;
}

function renderTopPositions(m) {
  const p = el("div", "panel listpanel");
  p.append(el("h2", null, "Top positions"));
  p.append(el("div", "hnote",
    "main book, top " + m.top_positions.length + " of " + m.stats.n_positions +
    " · " + m.quarter_label));
  const maxW = m.top_positions.length ? m.top_positions[0].weight_pct : 1;
  const dups = dupNames(m.top_positions);
  m.top_positions.forEach((pos, i) => {
    const row = el("div", "barrow");
    row.tabIndex = 0;
    row.append(el("span", "rank num", String(i + 1)));
    const nm = el("span", "bname");
    nm.append(el("b", null, pos.ticker || pos.issuer));
    const sub = [pos.ticker ? pos.issuer : null,
                 dups.has(pos.ticker || pos.issuer) ? clsLabel(pos.cls) : null]
      .filter(Boolean).join(" · ");
    if (sub) nm.append(el("span", "issuer", sub));
    row.append(nm);
    const bar = el("span", "bar");
    const fill = el("span", "fill");
    fill.style.width = (pos.weight_pct / maxW * 100) + "%";
    bar.append(fill);
    row.append(bar);
    row.append(el("span", "bval num", fmtUSD(pos.value)));
    row.append(el("span", "bwt num", fmtPct(pos.weight_pct)));
    bindTip(row, () => [
      el("div", "tt-title", (pos.ticker ? pos.ticker + " · " : "") + pos.issuer),
      ttRow("Value", fmtFullUSD(pos.value)),
      ttRow("Shares", fmtInt(pos.shares)),
      ttRow("Weight", pos.weight_pct.toFixed(2) + "%"),
    ]);
    p.append(row);
  });
  return p;
}

function renderSectorMix(m) {
  const p = el("div", "panel listpanel sector");
  p.append(el("h2", null, "Sector mix"));
  p.append(el("div", "hnote", "SIC-derived (SEC EDGAR) · see methodology"));
  const maxW = m.sector_mix.length ? Math.max(...m.sector_mix.map(x => x.weight_pct)) : 1;
  m.sector_mix.forEach(sx => {
    const row = el("div", "barrow");
    row.tabIndex = 0;
    row.append(el("span", "bname", sx.sector));
    const bar = el("span", "bar");
    const fill = el("span", "fill");
    fill.style.width = (sx.weight_pct / maxW * 100) + "%";
    bar.append(fill);
    row.append(bar);
    row.append(el("span", "bval num", fmtUSD(sx.value)));
    row.append(el("span", "bwt num", fmtPct(sx.weight_pct)));
    bindTip(row, () => [
      el("div", "tt-title", sx.sector),
      ttRow("Value", fmtFullUSD(sx.value)),
      ttRow("Weight", sx.weight_pct.toFixed(2) + "%"),
    ]);
    p.append(row);
  });
  return p;
}

function renderChanges(m) {
  const p = el("div", "panel tablepanel");
  p.append(el("h2", null, "Significant changes"));
  p.append(el("div", "hnote", m.prev_quarter
    ? "vs " + qlabel(m.prev_quarter) + " · share-count based · new buys and exits always; " +
      "adds/trims at ≥25% share change on a ≥0.5% position, or ≥1pp of weight"
    : "no prior quarter on record"));
  if (!m.changes.length) {
    p.append(el("p", "consensus-empty", "No significant changes."));
    return p;
  }
  const t = el("table", "data num");
  const thead = el("thead");
  const hr = el("tr");
  [["Action", ""], ["Position", ""], ["Shares", "r"], ["Δ shares", "r"],
   ["Weight", "r"], ["Δ weight", "r"], ["Value now", "r"]].forEach(([h, cls]) => {
    hr.append(el("th", cls || null, h));
  });
  thead.append(hr); t.append(thead);
  const tb = el("tbody");
  const dups = dupNames(m.changes);
  m.changes.forEach(c => {
    const tr = el("tr");
    const tdA = el("td"); tdA.append(chip(c.action)); tr.append(tdA);
    const tdP = el("td");
    tdP.append(el("b", null, c.ticker || c.issuer));
    const sub = [c.ticker ? c.issuer : null,
                 dups.has(c.ticker || c.issuer) ? clsLabel(c["class"]) : null]
      .filter(Boolean).join(" · ");
    if (sub) tdP.append(el("span", "issuer", sub));
    tr.append(tdP);
    const tdS = el("td", "r");
    tdS.append(document.createTextNode(fmtInt(+c.shares_prev)));
    tdS.append(el("span", "arrow", " → "));
    tdS.append(document.createTextNode(fmtInt(+c.shares_cur)));
    tr.append(tdS);
    const pct = c.pct_change_shares === "" ? null : parseFloat(c.pct_change_shares);
    const tdD = el("td", "r");
    if (pct === null) tdD.textContent = "—";
    else tdD.append(el("span", pct >= 0 ? "act-up" : "act-down", signedPct(pct)));
    tr.append(tdD);
    const tdW = el("td", "r");
    tdW.append(document.createTextNode(
      (+c.weight_prev_pct).toFixed(2) + "%"));
    tdW.append(el("span", "arrow", " → "));
    tdW.append(document.createTextNode((+c.weight_cur_pct).toFixed(2) + "%"));
    tr.append(tdW);
    const dw = +c.delta_weight_pp;
    const tdDW = el("td", "r");
    if (Math.abs(dw) < 0.005) tdDW.append(el("span", "arrow", "0.00pp"));
    else tdDW.append(el("span", dw >= 0 ? "act-up" : "act-down",
      (dw >= 0 ? "+" : "") + dw.toFixed(2) + "pp"));
    tr.append(tdDW);
    tr.append(el("td", "r", +c.value_cur_usd ? fmtUSD(+c.value_cur_usd) : "—"));
    tb.append(tr);
  });
  t.append(tb);
  p.append(t);
  return p;
}

function renderHoldings(m) {
  const d = el("details", "holdings");
  const sum = el("summary");
  sum.append(document.createTextNode("Full holdings — " + m.stats.n_positions +
    " positions" + (m.options.length ? " (+" + m.options.length + " option lines)" : "")));
  d.append(sum);
  const inner = el("div", "inner");
  const t = el("table", "data num");
  const hr = el("tr");
  [["#", ""], ["Ticker", ""], ["Issuer", ""], ["Shares", "r"], ["Value", "r"], ["Weight", "r"]]
    .forEach(([h, cls]) => hr.append(el("th", cls || null, h)));
  const thead = el("thead"); thead.append(hr); t.append(thead);
  const tb = el("tbody");
  const dups = dupNames(m.holdings);
  m.holdings.forEach((pos, i) => {
    const tr = el("tr");
    tr.append(el("td", null, String(i + 1)));
    tr.append(el("td", null, pos.ticker || "—"));
    tr.append(el("td", null, pos.issuer +
      (dups.has(pos.ticker || pos.issuer) && clsLabel(pos.cls)
        ? " · " + clsLabel(pos.cls) : "")));
    tr.append(el("td", "r", fmtInt(pos.shares)));
    tr.append(el("td", "r", fmtFullUSD(pos.value)));
    tr.append(el("td", "r", pos.weight_pct.toFixed(2) + "%"));
    tb.append(tr);
  });
  t.append(tb);
  inner.append(t);
  if (m.options.length) {
    inner.append(el("div", "hnote",
      "Option positions (puts/calls) — stored but outside the main book:"));
    const ot = el("table", "data num");
    const ohr = el("tr");
    [["Type", ""], ["Ticker", ""], ["Issuer", ""], ["Shares underlying", "r"], ["Value", "r"]]
      .forEach(([h, cls]) => ohr.append(el("th", cls || null, h)));
    const othead = el("thead"); othead.append(ohr); ot.append(othead);
    const otb = el("tbody");
    m.options.forEach(o => {
      const tr = el("tr");
      tr.append(el("td", null, o.put_call));
      tr.append(el("td", null, o.ticker || "—"));
      tr.append(el("td", null, o.issuer));
      tr.append(el("td", "r", fmtInt(o.shares)));
      tr.append(el("td", "r", fmtFullUSD(o.value)));
      otb.append(tr);
    });
    ot.append(otb);
    inner.append(ot);
  }
  d.append(inner);
  return d;
}

function renderSources(m) {
  const div = el("div", "sources");
  const filings = el("p");
  filings.append(document.createTextNode(
    "Holdings and changes derive from the quarter-final (post-amendment-merge) EDGAR filings: "));
  m.accessions.forEach((a, i) => {
    const link = el("a", null, a.accession);
    link.href = a.url; link.target = "_blank"; link.rel = "noopener";
    filings.append(link);
    if (i < m.accessions.length - 1) filings.append(document.createTextNode(", "));
  });
  filings.append(document.createTextNode(
    ". Committed tables: data/holdings/" + m.slug + "/" + m.quarter + ".csv" +
    (m.prev_quarter ? ", data/out/changes/" + m.slug + "/" + m.quarter + ".csv" : "") + "."));
  div.append(filings);
  if (m.aum.usd || m.aum.note) {
    const aum = el("p");
    aum.append(document.createTextNode("External AUM comparator: "));
    if (m.aum.source_url) {
      const link = el("a", null, m.aum.basis || "source");
      link.href = m.aum.source_url; link.target = "_blank"; link.rel = "noopener";
      aum.append(link);
      aum.append(document.createTextNode(
        (m.aum.as_of ? ", as of " + m.aum.as_of : "") +
        (m.aum.retrieved ? " (retrieved " + m.aum.retrieved + ")" : "") + "." +
        (m.aum.note ? " " + m.aum.note + "." : "")));
    } else {
      aum.append(document.createTextNode(m.aum.note + "."));
    }
    div.append(aum);
  }
  return div;
}

/* ---------- footer ---------- */
function renderFooter() {
  const f = document.getElementById("foot");
  const cols = el("div", "foot-cols");
  const c1 = el("div");
  c1.append(el("h2", null, "Methodology"));
  const ul = el("ul");
  [
    "Main book: shares-only 13F positions (sh/prn type SH, no puts/calls). Portfolio value, weights and top positions are computed on the main book; option lines are shown separately and never summed in.",
    "Significant change: any new buy or full exit; adds/trims with share-count change ≥25% of the prior holding where the position is ≥0.5% of the portfolio; any move of ≥1 percentage point of portfolio weight. Measured in share counts, never value.",
    "Holdings are quarter-final: the latest restatement (or original 13F-HR) plus subsequent new-holdings amendments, merged per SEC Form 13F Special Instruction 3.",
    "Sectors: issuer SIC code from SEC EDGAR company submissions, rolled up to GICS-style groups by a committed mapping (data/ref/sectors.csv). SIC is registration-based and approximate — e.g. some internet platforms classify under Information Technology.",
    "External AUM: Form ADV regulatory AUM (gross — can exceed net AUM for levered funds) where available; Berkshire uses 10-Q equity-securities fair value; Icahn uses IEP indicative NAV; see each manager page for the exact source.",
    "13F scope: US-listed long equity and options only. Short books, non-US listings, cash and private holdings are not disclosed and are not shown here.",
  ].forEach(s => ul.append(el("li", null, s)));
  c1.append(ul);
  const c2 = el("div");
  c2.append(el("h2", null, "Data"));
  const p1 = el("p");
  p1.append(document.createTextNode("Source of truth: "));
  const a1 = el("a", null, "SEC EDGAR");
  a1.href = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany"; a1.target = "_blank"; a1.rel = "noopener";
  p1.append(a1);
  p1.append(document.createTextNode(
    " 13F filings, parsed and amendment-merged by the repo pipeline (ADR 0001: aggregator sites are QA cross-checks, never ingested). Every figure on these pages traces to a committed CSV under data/."));
  c2.append(p1);
  c2.append(el("p", null,
    "As-of quarter: " + DATA.as_of_label + " — the latest quarter with quarter-final filings across the manager list. " +
    "Q2 2026 filings (due 2026-08-14) enter after the post-deadline re-pull."));
  c2.append(el("p", null,
    "Tickers via OpenFIGI (committed cache with manual overrides). Positions with no US listing may show no ticker; they remain in every total."));
  c2.append(el("div", "gen",
    "Generated " + DATA.generated + " · python src/dashboard.py · " +
    "regenerate after each quarterly pipeline run · GEMS internal research — not investment advice."));
  cols.append(c1, c2);
  f.replaceChildren(cols);
}

/* ---------- router ---------- */
function route() {
  tip.style.display = "none";
  const h = location.hash || "#/";
  const mMatch = h.match(/^#\/m\/([a-z0-9-]+)$/);
  if (mMatch) renderManager(mMatch[1]);
  else renderLanding();
}
document.getElementById("siteQuarter").textContent =
  DATA.as_of_label + " · " + DATA.managers.length + " managers";
window.addEventListener("hashchange", route);
renderFooter();
route();
</script>
