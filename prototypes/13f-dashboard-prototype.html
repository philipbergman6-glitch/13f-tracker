// (EDGAR XBRL companyconcept EquitySecuritiesFvNi, filed 2026-08-10). NOTE as-of mismatch vs 13F 2026-03-31.
const AUM = { label: "Equity securities at fair value (10-Q)", value: 323779000000,
              asof: "2026-06-30", note: "13F misses foreign-listed (e.g. Japan trading houses) & non-13F assets" };

// ILLUSTRATIVE MOCK — cross-manager summary sketch (only Berkshire is parsed).
const MOCK_CROSS = {
  bought: [
    {t:"NVDA", n:"NVIDIA Corp", mgrs:["Coatue","Viking","Tiger Global","Lone Pine","Altimeter"]},
    {t:"GOOGL", n:"Alphabet Inc", mgrs:["Berkshire","Third Point","Maverick","TCI"]},
    {t:"MSFT", n:"Microsoft Corp", mgrs:["Fundsmith","Lindsell Train","Giverny"]},
    {t:"DAL", n:"Delta Air Lines", mgrs:["Berkshire","Appaloosa"]}],
  sold: [
    {t:"AAPL", n:"Apple Inc", mgrs:["Atreides","Maverick","Greenlight"]},
    {t:"V", n:"Visa Inc", mgrs:["Berkshire","Pershing Square","Giverny"]},
    {t:"UNH", n:"UnitedHealth", mgrs:["Berkshire","Viking"]}]
};

const fmtB = v => "$" + (v/1e9).toFixed(v >= 1e10 ? 1 : 2) + "bn";
const fmtM = v => v >= 1e9 ? fmtB(v) : "$" + (v/1e6).toFixed(0) + "m";
const pct = w => (w*100).toFixed(2) + "%";
const tk = c => (META[c]||["—","Unmapped"])[0];
const sec = c => (META[c]||["?","Unmapped (prototype)"])[1];

function sectorAgg() {
  const m = new Map();
  for (const h of DATA.holdings) m.set(sec(h.cusip), (m.get(sec(h.cusip))||0) + h.value);
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
function issuerHoldings(n) { // holdings merged across share classes by ticker-name, top n + Other
  const rows = DATA.holdings.slice();
  const top = rows.slice(0, n), rest = rows.slice(n);
  return { top, other: rest.reduce((s,h)=>s+h.value,0), otherCount: rest.length };
}

// ---------- shared components ----------
const tip = document.getElementById("tooltip");
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", e => {
      tip.innerHTML = el.dataset.tip; tip.style.display = "block";
      const x = Math.min(e.clientX + 14, innerWidth - 320);
      tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px";
    });
    el.addEventListener("mouseleave", () => tip.style.display = "none");
  });
}
function bars(items, maxV, valFn) { // horizontal bar list, single series
  return items.map(it => `
    <div class="barrow" data-tip="${it.tip.replace(/"/g,'&quot;')}">
      <span class="lbl">${it.label}</span>
      <span class="bartrack"><span class="bar" style="width:${(it.value/maxV*100).toFixed(2)}%"></span></span>
      <span class="val num">${valFn(it.value)}</span>
    </div>`).join("");
}
function chgWord(k){ return {new:"NEW BUY", add:"ADD", trim:"TRIM", exit:"EXIT"}[k]; }
function chgClass(k){ return (k==="new"||k==="add") ? "up" : "down"; }
function chgArrow(k){ return (k==="new"||k==="add") ? "▲" : "▼"; }
function chgDetail(c) {
  if (c.kind==="new")  return `0 → ${c.shares_now.toLocaleString()} sh (${pct(c.w_now)} of book)`;
  if (c.kind==="exit") return `${c.shares_prev.toLocaleString()} sh → 0 (was ${pct(c.w_prev)})`;
  const p = ((c.shares_now-c.shares_prev)/c.shares_prev*100).toFixed(0);
  return `${c.shares_prev.toLocaleString()} → ${c.shares_now.toLocaleString()} sh (${p>0?"+":""}${p}%), wt ${pct(c.w_prev)} → ${pct(c.w_now)}`;
}
function changesTable(changes) {
  return `<table><thead><tr><th>Action</th><th>Ticker</th><th>Issuer</th><th class="r">Shares Δ</th><th class="r">Wt now</th></tr></thead><tbody>` +
  changes.map(c => `<tr>
    <td><span class="${chgClass(c.kind)}">${chgArrow(c.kind)} ${chgWord(c.kind)}</span></td>
    <td class="num">${tk(c.cusip)}</td><td>${c.name}</td>
    <td class="r num src">${chgDetail(c)}</td>
    <td class="r num">${pct(c.w_now)}</td></tr>`).join("") + "</tbody></table>";
}
function crossTable() {
  const row = (r, dir) => `<tr>
    <td><span class="${dir==='b'?'up':'down'}">${dir==='b'?'▲ Bought':'▼ Sold'}</span></td>
    <td class="num">${r.t}</td><td>${r.n}</td>
    <td class="r num">${r.mgrs.length}</td><td class="src">${r.mgrs.join(", ")}</td></tr>`;
  return `<div style="overflow-x:auto"><table><thead><tr><th>Direction</th><th>Ticker</th><th>Name</th><th class="r"># Mgrs</th><th>Managers</th></tr></thead>
  <tbody>${MOCK_CROSS.bought.map(r=>row(r,'b')).join("")}${MOCK_CROSS.sold.map(r=>row(r,'s')).join("")}</tbody></table></div>`;
}
function sources() {
  return `<p class="src" style="margin-top:18px">Sources: SEC EDGAR 13F-HR, Berkshire Hathaway Inc (CIK 1067983) —
  Q1-2026 accession ${DATA.acc_now} (filed ${DATA.filed_now}), Q4-2025 accession ${DATA.acc_prev} (filed ${DATA.filed_prev}), retrieved 2026-08-12.
  AUM comparator: 10-Q equity securities at fair value $323.8bn as of ${AUM.asof} (EDGAR XBRL, filed 2026-08-10) —
  note the as-of mismatch vs the 13F period ${DATA.period_now}. Sector &amp; ticker mappings are prototype hand-maps.
  Change thresholds per repo CONTEXT.md (share-count based). Main book = shares only; no put/call rows this quarter.</p>`;
}
function heroTiles(compact) {
  const d = DATA.total_now - DATA.total_prev, dp = d/DATA.total_prev*100;
  const cov = DATA.total_now/AUM.value*100;
  const tile = (k,v,sub,cls) => `<div class="panel" style="padding:${compact?'10px 14px':'16px 20px'};flex:1;min-width:170px">
    <div class="src">${k}</div><div class="num ${cls||''}" style="font-size:${compact?'20px':'26px'};font-weight:650">${v}</div>
    <div class="src">${sub}</div></div>`;
  return `<div style="display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 22px">
    ${tile("13F main book · " + DATA.period_now, fmtB(DATA.total_now), DATA.n_positions_now + " positions")}
    ${tile("QoQ change", (d<0?"−":"+") + fmtB(Math.abs(d)).slice(1), (dp<0?"−":"+")+Math.abs(dp).toFixed(1)+"% vs " + DATA.period_prev, d<0?"down":"up")}
    ${tile("Equity portfolio per 10-Q", fmtB(AUM.value), "as of " + AUM.asof + " — later than 13F")}
    ${tile("13F coverage of 10-Q equities", cov.toFixed(0) + "%", "gap ≈ foreign-listed + timing")}
  </div>`;
}

// ---------- switcher ----------
const VARIANTS = [["A","Quarterly report", renderA],["B","Desk terminal", renderB],["C","Cross-manager first", renderC]];
function currentKey() {
  const q = new URLSearchParams(location.search).get("variant") || (location.hash||"").replace("#","");
  return VARIANTS.some(v=>v[0]===q) ? q : "A";
}
function show(key) {
  const [k, name, fn] = VARIANTS.find(v=>v[0]===key);
  const el = document.getElementById("app");
  fn(el); bindTips(el);
  document.getElementById("vlabel").textContent = `${k} — ${name}`;
  try { history.replaceState(null,"", location.pathname + "?variant=" + k); }
  catch(e) { location.hash = k; }   // file:// fallback in some browsers
  document.title = `13F prototype — ${k} ${name}`;
}
function cycle(d) {
  const i = VARIANTS.findIndex(v=>v[0]===currentKey());
  show(VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length][0]);
}
document.getElementById("prev").onclick = ()=>cycle(-1);
document.getElementById("next").onclick = ()=>cycle(1);
addEventListener("keydown", e => {
  if (["INPUT","TEXTAREA"].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if (e.key==="ArrowLeft") cycle(-1); if (e.key==="ArrowRight") cycle(1);
});
show(currentKey());
</script>
